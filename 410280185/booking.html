<button onclick="toggleMusic()">🎵 音樂開 / 關</button>

<script>
    const music = document.getElementById("bg-music");

    function toggleMusic() {
        if (music.muted) {
            music.muted = false;
            music.play();
        } else {
            music.muted = true;
        }
    }
